server {
    listen 80;
    server_name eloleaderboard.de www.eloleaderboard.de;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers for GDPR / security compliance
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Content Security Policy - Production
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://cdn.intra.42.fr https://api.dicebear.com data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.intra.42.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # HSTS - Production with SSL
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SEO: Serve robots.txt and sitemap.xml with proper headers
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header Cache-Control "public, max-age=86400"; # Cache for 1 day
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        add_header Cache-Control "public, max-age=3600"; # Cache for 1 hour
    }

    # Main SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        # SEO: Add caching for HTML with revalidation
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SEO: Handle trailing slashes
    rewrite ^/(.*)/$ /$1 permanent;
}
